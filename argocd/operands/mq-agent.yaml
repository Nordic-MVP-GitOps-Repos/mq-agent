# Deploys the CCDT ConfigMap that the MQ Agent MCP server uses to connect to the queue manager.
# The MQ Agent Helm chart itself is installed manually with helm (it needs watsonx secrets
# that are not stored in git) — see components/mq-agent/base/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mq-agent-config
  namespace: openshift-gitops
  labels:
    group: applications
  annotations:
    argocd.argoproj.io/sync-wave: "350"
spec:
  destination:
    namespace: cp4i
    server: https://kubernetes.default.svc
  project: cp4i-operands
  source:
    repoURL: https://github.com/Nordic-MVP-GitOps-Repos/mq-agent.git
    path: components/mq-agent/base
  syncPolicy:
    automated:
      selfHeal: true
