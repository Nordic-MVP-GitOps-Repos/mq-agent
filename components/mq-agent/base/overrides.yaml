# IBM MQ Agent Helm chart overrides
# Reference: https://www.ibm.com/docs/en/ibm-mq/9.4.x?topic=cluster-mq-agent-helm-chart-values
#
# Sensitive values (watsonx projectID and API key) are NOT stored here.
# Supply them at deploy time via overrides-secrets.yaml (see README.md).

license:
  accept: true
  # L-CXDB-XTZ9J8 = IBM MQ Advanced
  # L-DPTV-SYNAFJ = IBM MQ Advanced NonProduction
  # L-VCNK-GTT2F3 = IBM Cloud Pak for Integration
  # L-HRAV-KRAE8U = IBM Cloud Pak for Integration NonProduction
  license: L-DPTV-SYNAFJ

metadata:
  annotations:
    productID: "208423bb063c43288328b1d788745b0c"
    productName: "IBM MQ Advanced"
    productMetric: "PROCESSOR_VALUE_UNIT"
    productChargedContainers: "All"

agent:
  tlsSecretName: mq-agent-tls
  model:
    providers:
      myWatsonxRuntime:
        watsonxService:
          # projectID and key are supplied via overrides-secrets.yaml — never committed to git

mcpServer:
  ccdtConfigMapName: mq-agent-ccdt
  # Uncomment if your QM channel requires a TLS client certificate:
  # keyStoreSecretName: agent-qm-keystore
  # keyStorePassword: ""
  # Uncomment if your QM channel requires username/password authentication:
  # configurationSecretName: mq-agent-credentials

imagePullSecrets: ibm-entitlement-key

route:
  enabled: true
